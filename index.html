<!DOCTYPE html>
<html>

<head>
    <title>Web điểm danh</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href="/manifest.json">
</head>

<body>

    <h2>Web điểm danh</h2>

    <!-- Môn học -->
    <label>Môn học</label><br>
    <input type="text" id="monhoc" value="Cơ sở dữ liệu" readonly>
    <br><br>

    <!-- Thời gian -->
    <label>Thời gian điểm danh</label><br>
    <input type="text" id="thoigian" readonly>
    <br><br>

    <!-- MSSV -->
    <label>Nhập mã sinh viên</label><br>
    <input type="text" id="masv" required>
    <br><br>

    <!-- ẨN: lưu vị trí ghế -->
    <input type="hidden" id="seat">

    <!-- Ghế -->
    <h3>Chọn vị trí chỗ ngồi</h3>

    <div class="seats">
        <button class="seat" onclick="chonGhe(1)">1</button>
        <button class="seat" onclick="chonGhe(2)">2</button>
        <button class="seat" onclick="chonGhe(3)">3</button>
        <button class="seat" onclick="chonGhe(4)">4</button>

        <br><br>

        <button class="seat" onclick="chonGhe(5)">5</button>
        <button class="seat" onclick="chonGhe(6)">6</button>
        <button class="seat" onclick="chonGhe(7)">7</button>
        <button class="seat" onclick="chonGhe(8)">8</button>
    </div>

    <br>

    <!-- Nút điểm danh -->
    <button onclick="diemDanh()">Điểm danh</button>

    <script src="script.js"></script>

</body>

</html>
